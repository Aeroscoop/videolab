<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoLab</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="topbar"><div class="brand"><span class="mark">◩</span><strong>VideoLab</strong><small>fase 5</small></div><div class="actions"><button id="save">Project opslaan</button><button id="load">Project openen</button><button id="import" class="primary">+ Video importeren</button><button id="capture" hidden>Tabblad opnemen</button><button id="export" disabled>MP4 exporteren</button><input id="file" type="file" accept="video/*" hidden><input id="project-file" type="file" accept=".json,application/json" hidden></div></header>
<main class="workspace">
<section class="viewer"><div class="viewer-head"><span>Preview</span><span id="status" role="status">Importeer een video om te beginnen</span></div><div class="stage-wrap"><div id="stage" class="stage ratio-4-5"><div class="video-layer" id="video-layer"><video id="video" playsinline preload="metadata"></video><div id="placeholder"><span>▶</span><p>Je video verschijnt hier</p></div></div><div id="safe" class="safe" aria-hidden="true"></div></div></div><div class="transport"><button id="back" title="5 seconden terug">↶ 5s</button><button id="play" aria-label="Afspelen">▶</button><button id="forward" title="5 seconden vooruit">5s ↷</button><span id="clock">00:00 / 00:00</span><label for="speed">Afspeelsnelheid</label><select id="speed"><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1">1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option></select></div></section>
<aside class="inspector"><h2>Canvas</h2><label for="format">Formaat</label><select id="format"><option value="4:5">4:5 — Instagram / LinkedIn feed</option><option value="9:16">9:16 — Reels / Shorts</option><option value="16:9">16:9 — Landscape</option><option value="1:1">1:1 — Vierkant</option></select><label for="background">Achtergrond</label><div class="colorrow"><input type="color" id="background" value="#a9c9b6"><span id="background-label">#a9c9b6</span></div><h2>Opname</h2><label for="scale">Schaal <output id="scale-value">80%</output></label><input id="scale" type="range" min="20" max="130" value="80" step="1"><label for="x">Horizontaal <output id="x-value">0%</output></label><input id="x" type="range" min="-100" max="100" value="0"><label for="y">Verticaal <output id="y-value">0%</output></label><input id="y" type="range" min="-100" max="100" value="0"><label for="overlay">Platformrichtzone</label><select id="overlay"></select><label class="toggle"><input id="safe-toggle" type="checkbox" checked> Richtzone tonen</label><button id="reset" class="secondary">Positie herstellen</button><p class="hint">Richtzones dienen als ontwerphulp. <button id="guide-source" class="text-button" hidden>Bekijk bron</button></p></aside>
<section class="timeline"><div class="timeline-head"><strong>Tijdlijn</strong><div class="trim-controls"><button id="trim-start" disabled>Begin hier</button><button id="trim-end" disabled>Einde hier</button><button id="split" disabled>Splits hier</button><button id="remove-clip" disabled>Verwijder clip</button><button id="trim-reset" disabled>Herstel bereik</button><button id="undo" disabled>Ongedaan maken</button><output id="trim-range" aria-label="Trimbereik"></output></div><span id="clipname">Geen media</span></div><div class="ruler" id="ruler"><input id="scrubber" aria-label="Tijdpositie" type="range" min="0" max="100" step=".01" value="0" disabled></div><div class="track" id="track"><div id="clip" class="clip empty">Video-track · importeer een opname</div><div id="segments" hidden></div></div><div class="timeline-foot"><span>Track 1 · Video</span><span id="duration">00:00</span></div></section>
</main>
<script type="module" src="./js/app.js"></script>
</body></html>
